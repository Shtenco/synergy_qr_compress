[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shtenco-qr-compress"
version = "0.1.0"
description = "Lossless temporal container + adaptive compression + multi-QR framing"
requires-python = ">=3.10"
dependencies = ["qrcode[pil]>=7.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qr-compress = "qr_temporal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
