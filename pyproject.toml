[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shtenco-qr-compress"
version = "0.4.0"
description = "QTC1/QTC2/QTD2/QTD3 lossless temporal-model and repository walk-forward compression with multi-QR framing"
requires-python = ">=3.10"
dependencies = [
  "qrcode[pil]>=7.4",
  "zstandard>=0.22",
  "brotli>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qr-compress = "qr_temporal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
